name: License audit
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: license-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      ASTRO_TELEMETRY_DISABLED: '1'
      LICENSE_AUDIT: '1'
      WRANGLER_LOG_PATH: .wrangler/logs
      WRANGLER_REGISTRY_PATH: .wrangler/registry
      SCANCODE_CACHE: ${{ github.workspace }}/.cache/scancode-toolkit
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:licenses && pnpm check:notices
      - run: pnpm build
      - run: pnpm license:prepare
      - name: Install verified ScanCode Toolkit 32.4.1
        run: scripts/license/install-scancode.sh
      - name: Validate SPDX with official spdx-tools 0.8.2
        run: '"$RUNNER_TEMP/scancode-toolkit/venv/bin/python" scripts/license/validate-spdx.py .cache/license/reports/sbom.spdx.json'
      - name: Scan explicitly selected files (no secrets or credentials)
        run: >-
          "$RUNNER_TEMP/scancode-toolkit/scancode"
          --license --copyright --info --processes 2
          --json-pp .cache/license/reports/scancode.json .cache/license/input
      - name: Verify completeness and create human review report
        if: ${{ !cancelled() }}
        run: pnpm license:report
      - name: Publish report summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f .cache/license/reports/summary.md ]; then
            cat .cache/license/reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'License audit incomplete; inspect the failed step. No successful scan is claimed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload selected reports only
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: license-reports
          # Only the five explicitly listed files below; .cache is hidden.
          include-hidden-files: true
          path: |
            .cache/license/reports/scancode.json
            .cache/license/reports/sbom.spdx.json
            .cache/license/reports/coverage.json
            .cache/license/reports/review.json
            .cache/license/reports/summary.md
          if-no-files-found: error
          retention-days: 7
