name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_LOG_PATH: .wrangler/logs
      WRANGLER_REGISTRY_PATH: .wrangler/registry
      UI_EXPECT_CJK_FONT: Noto Sans CJK SC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm auth:setup
      - run: pnpm cf:types
      - run: git diff --exit-code worker-configuration.d.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm check:licenses
      - run: pnpm check:notices
      - run: pnpm check:metadata
      - run: pnpm check:secrets
      - run: pnpm build
      - run: pnpm db:migrate && pnpm db:seed
      - name: Use Ubuntu HTTPS archives for browser dependencies
        run: |
          # The hosted image already provides these official HTTPS fallbacks.
          # Azure HTTP downloads stalled in runs 40315150783 and 40311464423.
          grep -Fx 'URIs: mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
          grep -q '^https://archive\.ubuntu\.com/ubuntu/' /etc/apt/apt-mirrors.txt
          sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
          cat /etc/apt/apt-mirrors.txt
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-ci-downloads
      - name: Install Chromium and system dependencies
        timeout-minutes: 5
        run: pnpm exec playwright install --with-deps chromium
      - name: Install licensed CJK screenshot font
        timeout-minutes: 3
        run: |
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          dpkg-query -W -f='${Package} ${Version}\n' fonts-noto-cjk
          cat /usr/share/doc/fonts-noto-cjk/copyright
      - name: Inspect screenshot runner fonts
        run: |
          fc-match 'sans-serif:lang=zh-cn'
          fc-match 'Noto Sans CJK SC:lang=zh-cn'
          fc-list :lang=zh family | sort -u
      - run: pnpm test:e2e
      - name: Capture isolated UI review screenshots
        run: pnpm exec playwright test tests/e2e/ui.spec.ts --output=test-results/ui-review
      - name: Upload UI review screenshots
        uses: actions/upload-artifact@v4
        with:
          name: 0xca-ui-review
          path: test-results/ui-review/**/*.png
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history with Gitleaks
        env:
          GITLEAKS_VERSION: '8.30.0'
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner .
